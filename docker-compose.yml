# Nome de projeto fixo: isola containers, rede e volume desta app dos
# de qualquer outra instância que já exista na VM (evita colisão de nomes).
name: taxa-frequencia

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # pgdata_pg18: volume novo (o antigo "pgdata" tinha dados gravados por
      # Postgres 17 num formato incompativel com a imagem 18; foi preservado
      # intacto como backup e nao e mais referenciado aqui). A imagem
      # postgres:18 declara VOLUME /var/lib/postgresql (sem "/data") e trata
      # qualquer mount em /var/lib/postgresql/data como caminho legado — por
      # isso o mount aqui precisa ser exatamente em /var/lib/postgresql.
      - pgdata_pg18:/var/lib/postgresql
      # Restauração automática do backup: TODO arquivo .sql colocado na pasta
      # ./backup é executado pelo Postgres APENAS na primeira inicialização
      # (quando o volume pgdata_pg18 ainda está vazio). É assim que o banco
      # "sobe já com o backup". Coloque seu dump .sql dentro de ./backup na VM.
      - ./backup:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Não exponha a porta do banco para fora da VM em produção.
    # Descomente apenas se precisar acessar o Postgres do host:
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      CRON_SECRET: ${CRON_SECRET}
    # Sem "ports": o app não fica publicado no host, só acessível dentro do
    # Docker. NPM alcança via rede compartilhada "npm_network" abaixo.
    networks:
      - default
      - npm_network
    depends_on:
      db:
        condition: service_healthy

  # Substitui o Vercel Cron: chama /api/cron/snapshot nos dias úteis.
  # Schedule em UTC (idêntico ao vercel.json: "0 22 * * 1-5").
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ./docker/cron-entrypoint.sh:/cron-entrypoint.sh:ro
    entrypoint: ["sh", "/cron-entrypoint.sh"]
    depends_on:
      - app

volumes:
  pgdata_pg18:

networks:
  default: {}
  # Rede do Nginx Proxy Manager (definida em /opt/nginx-proxy-manager na VM).
  # external: true = não recriar, só se conectar à que já existe.
  npm_network:
    external: true
    name: nginx-proxy-manager_default
