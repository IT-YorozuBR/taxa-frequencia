# Nome de projeto fixo: isola containers, rede e volume desta app dos
# de qualquer outra instância que já exista na VM (evita colisão de nomes).
name: taxa-frequencia

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
      # Restauração automática do backup: TODO arquivo .sql colocado na pasta
      # ./backup é executado pelo Postgres APENAS na primeira inicialização
      # (quando o volume pgdata ainda está vazio). É assim que o banco "sobe
      # já com o backup". Coloque seu dump .sql dentro de ./backup na VM.
      - ./backup:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Não exponha a porta do banco para fora da VM em produção.
    # Descomente apenas se precisar acessar o Postgres do host:
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      CRON_SECRET: ${CRON_SECRET}
    # Porta do HOST configurável via APP_PORT (interna sempre 3000).
    # Definida como 3001 no .env.docker para não colidir com a outra
    # instância que já usa a 3000 nesta VM.
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # Substitui o Vercel Cron: chama /api/cron/snapshot nos dias úteis.
  # Schedule em UTC (idêntico ao vercel.json: "0 22 * * 1-5").
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ./docker/cron-entrypoint.sh:/cron-entrypoint.sh:ro
    entrypoint: ["sh", "/cron-entrypoint.sh"]
    depends_on:
      - app

volumes:
  pgdata:
